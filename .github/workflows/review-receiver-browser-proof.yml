name: review - receiver browser proof

# Runs only on review/** branches. Nothing here deploys: Pages serves main.
# It proves a proposed index.html change in real Chromium and WebKit, and runs
# the same click and link checks against main's index.html, so the report shows
# the fault before and the fix after.
on:
  push:
    branches: ['review/**']

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright with Chromium and WebKit (not saved to package.json)
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium webkit

      - name: Prepare main's page beside the proposed page
        run: |
          git fetch -q --depth 1 origin main
          mkdir -p /tmp/base
          cp -r . /tmp/base/
          git show FETCH_HEAD:index.html > /tmp/base/index.html
          echo "proposed index.html sha256: $(sha256sum index.html | cut -c1-64)"
          echo "main     index.html sha256: $(sha256sum /tmp/base/index.html | cut -c1-64)"

      # The existing receiver proof had never run in CI. Run it on BOTH pages, so a failure
      # that main already has is not charged to the proposal. Both steps report; the final
      # step compares them and fails only if the proposal fails a check main passes.
      - name: Existing receiver proof on main's page (file://)
        continue-on-error: true
        run: |
          cp index.html /tmp/proposed-index.html
          cp /tmp/base/index.html index.html
          set +e; node spider/receiver.proof.mjs > /tmp/receiver-main.log 2>&1; rc=$?; set -e
          cp /tmp/proposed-index.html index.html
          cat /tmp/receiver-main.log; echo "receiver proof on main rc=$rc"; exit $rc

      - name: Existing receiver proof on the proposed page (file://)
        continue-on-error: true
        run: |
          set +e; node spider/receiver.proof.mjs > /tmp/receiver-proposed.log 2>&1; rc=$?; set -e
          cat /tmp/receiver-proposed.log; echo "receiver proof on proposed rc=$rc"; exit $rc

      - name: Compare receiver proof failures (fail only on a new failure)
        run: |
          grep -E '^[[:space:]]*- ' /tmp/receiver-main.log | sed -E 's/^[[:space:]]+//' | sort > /tmp/f-main.txt || true
          grep -E '^[[:space:]]*- ' /tmp/receiver-proposed.log | sed -E 's/^[[:space:]]+//' | sort > /tmp/f-proposed.txt || true
          echo "failing on main:";     cat /tmp/f-main.txt
          echo "failing on proposed:"; cat /tmp/f-proposed.txt
          grep -q 'checks passed\|FAILED' /tmp/receiver-main.log || { echo "main proof did not run to a verdict"; exit 1; }
          grep -q 'checks passed\|FAILED' /tmp/receiver-proposed.log || { echo "proposed proof did not run to a verdict"; exit 1; }
          # a FAILED log with an empty failure list means this parser is broken: refuse to pass
          if grep -q FAILED /tmp/receiver-main.log && [ ! -s /tmp/f-main.txt ]; then echo "could not read main failures"; exit 1; fi
          if grep -q FAILED /tmp/receiver-proposed.log && [ ! -s /tmp/f-proposed.txt ]; then echo "could not read proposed failures"; exit 1; fi
          new=$(comm -13 /tmp/f-main.txt /tmp/f-proposed.txt)
          if [ -n "$new" ]; then echo "NEW failures introduced by the proposal:"; echo "$new"; exit 1; fi
          echo "no new receiver proof failures"

      - name: Click and link checks on main's page (expected to show the fault)
        continue-on-error: true
        run: |
          (cd /tmp/base && python3 -m http.server 8001 >/dev/null 2>&1 &)
          sleep 2
          PAGE_URL=http://127.0.0.1:8001/index.html node spider/click-and-link-note.proof.mjs

      - name: Click and link checks on the proposed page (must pass)
        run: |
          (python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          PAGE_URL=http://127.0.0.1:8000/index.html node spider/click-and-link-note.proof.mjs

      # Lazy drill-in through child_path: serves its own fixture; a missing browser is a FAIL.
      - name: Drill-in proof on the proposed page (must pass)
        run: node spider/drill-in.proof.mjs
