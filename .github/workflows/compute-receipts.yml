name: Compute receipt owner verification
on:
  pull_request:
    paths:
      - 'engine/**'
      - 'proofs/**'
      - 'tools/build-browser-observer.mjs'
      - '.github/workflows/compute-receipts.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compute-receipts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
