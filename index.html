<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ventus Global Grid 2050 · The Spider Sandbox</title>
<style>
  :root{
    --bg:#0b0d12;--panel:#12151c;--panel2:#151923;--line:#262b36;--text:#eef2fb;--muted:#9aa3b5;--cyan:#00e5ff;
    --e-data:#00e5ff;--e-governance:#b47cff;--e-archive:#7da0c8;--e-external:#5f76a4;--e-repo:#b8ccff;--e-workflow:#00ffff;
    --safe-x:clamp(12px,2.3vw,28px);--shell:1040px;--card:220px;--gap:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(1200px 700px at 50% -10%,rgba(0,229,255,.06),transparent 60%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  button,select{font:inherit}
  .top{border-bottom:1px solid var(--line);background:rgba(11,13,18,.92);backdrop-filter:blur(16px)}
  .bar,.controls,.crumbs,.hint{width:min(var(--shell),calc(100vw - var(--safe-x)*2));margin:0 auto}
  .bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:max(env(safe-area-inset-top),12px) 0 10px}
  .brand{display:flex;flex-direction:column;line-height:1.05;min-width:190px}
  .brand .ey{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
  .brand h1{margin:2px 0 0;font-size:1rem;font-weight:650}
  .pick{display:flex;align-items:center;gap:8px;flex:1 1 280px;min-width:0}
  .pick label,.grouplabel{font-family:ui-monospace,monospace;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);flex:none}
  select{flex:1 1 auto;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 32px 9px 12px;font-size:.85rem;cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) center,calc(100% - 11px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

  .count{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--muted);margin-left:auto;white-space:nowrap}
  .count b{color:var(--text);font-weight:600}
  .controls{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 0 4px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none;background:rgba(18,21,28,.7)}
  .seg button{border:0;background:transparent;color:var(--muted);font-size:.72rem;padding:7px 13px;cursor:pointer;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:rgba(0,229,255,.16);color:var(--text)}
  .seg button.gh[aria-pressed="true"]{background:rgba(184,204,255,.18)}
  .seg button.ext[aria-pressed="true"]{background:rgba(95,118,164,.28)}
  .seg button:disabled{opacity:.4;cursor:not-allowed}
  .viewbtn{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.86rem;line-height:1;display:inline-flex;align-items:center;gap:7px}
  .viewbtn[aria-pressed="true"]{border-color:var(--cyan);background:rgba(0,229,255,.16);box-shadow:0 0 22px rgba(0,229,255,.12)}
  .srctag{margin-left:auto;font-family:ui-monospace,monospace;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  .srctag.live{color:var(--cyan);border-color:rgba(0,229,255,.4)}
  .crumbs{display:flex;align-items:center;gap:6px;padding:2px 0 0;font-family:ui-monospace,monospace;font-size:.66rem;color:var(--muted);min-height:18px}
  .crumbs a{color:var(--cyan);cursor:pointer;text-decoration:none}
  .crumbs .sep{opacity:.5}
  .hint{padding:4px 0 8px;font-family:ui-monospace,monospace;font-size:.62rem;color:var(--muted)}
  .hint b{color:var(--text);font-weight:600}
  .stage{flex:1;min-height:0;position:relative;overflow:hidden}
  .overlay{position:absolute;inset:0}
  .overlay.column{overflow-y:auto;overflow-x:hidden;padding:16px var(--safe-x) max(env(safe-area-inset-bottom),22px)}
  .shell{width:min(var(--shell),100%);margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.014));padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:74px;box-shadow:0 16px 44px rgba(0,0,0,.12)}
  .card .row{display:flex;align-items:center;gap:7px}
  .badge{font-family:ui-monospace,monospace;font-size:.55rem;letter-spacing:.07em;border:1px solid var(--line);border-radius:6px;padding:2px 5px;color:var(--muted);flex:none}
  .name{font-size:.85rem;font-weight:650;line-height:1.15;overflow-wrap:anywhere}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-left:auto;box-shadow:0 0 8px currentColor}
  .reason{font-size:.68rem;color:var(--muted);line-height:1.25}
  .relrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .reltag{font-family:ui-monospace,monospace;font-size:.55rem;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:999px;border:1px solid currentColor}
  .arrow{font-family:ui-monospace,monospace;font-size:.62rem;color:var(--muted)}
  .go{font-family:ui-monospace,monospace;font-size:.6rem;color:var(--cyan);margin-left:auto}
  .is-center{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(0,229,255,.22),0 0 26px rgba(0,229,255,.12)}
  .is-center .name{font-size:.95rem}
  .contents{align-self:flex-start;margin-top:3px;font-family:ui-monospace,monospace;font-size:.62rem;color:var(--cyan);border:1px solid rgba(0,229,255,.4);border-radius:999px;padding:4px 10px;background:rgba(0,229,255,.08);cursor:pointer}
  .inert{opacity:.34}
  .sect{font-family:ui-monospace,monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 2px 4px}
  .branch{position:relative;padding-left:20px;display:flex;flex-direction:column;gap:9px}
  .branch::before{content:"";position:absolute;left:7px;top:-6px;bottom:14px;width:2px;background:var(--line)}
  .twig{position:relative;cursor:pointer}
  .twig::before{content:"";position:absolute;left:-13px;top:28px;width:13px;height:2px;background:var(--twig,var(--line))}
  .twig .card{border-left:3px solid var(--twig,var(--line))}
  .empty{color:var(--muted);font-size:.78rem;padding:6px 2px}
  .overlay.spider{overflow:auto;cursor:grab;background:radial-gradient(circle at center,rgba(0,229,255,.045),transparent 45%)}
  .overlay.spider.dragging{cursor:grabbing;user-select:none}
  .spiderCanvas{position:relative;min-width:100%;min-height:100%}
  .wirelabel{font:600 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;opacity:.9;pointer-events:none;paint-order:stroke;stroke:#0a0e14;stroke-width:3px;stroke-linejoin:round}
  .ver{font-size:.55em;color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:.08em}
  .linknote{margin-top:4px;color:var(--cyan)}
  .inlink{color:var(--cyan);text-decoration:none;word-break:break-all}
  .inlink:hover{text-decoration:underline}
  .maya{margin-top:8px;border:1px solid rgba(255,196,60,.5);background:linear-gradient(160deg,rgba(255,196,60,.10),rgba(255,196,60,.03));border-radius:10px;padding:8px 10px}
  .maya.compact{margin-top:6px;padding:6px 9px;font-size:.78rem;color:#f0e6cf;line-height:1.4}
  .maya-h{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;text-transform:uppercase;color:#ffc43c;margin-right:5px}
  .maya .maya-h{display:block;margin-bottom:4px}
  .maya.compact .maya-h{display:inline}
  .maya-b{font-size:.86rem;color:#f0e6cf;margin-top:3px;line-height:1.45}
  .maya-k{color:#ffc43c}
  .maya-end{color:#c9bfa6;font-size:.8rem;margin-top:6px}
  .roads{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .road{font-size:.68rem;padding:3px 9px;border-radius:999px;border:1px solid rgba(0,229,255,.35);color:var(--cyan);text-decoration:none;white-space:nowrap}
  .road.gh{border-color:rgba(184,204,255,.4);color:#b8ccff}
  .road.ext{border-color:rgba(95,118,164,.5);color:#9fb3d9}
  .road.none{border-style:dashed;border-color:rgba(255,255,255,.18);color:var(--muted)}
  .road.derived{border-color:rgba(255,196,0,.4);color:#e2b93b}
  .road:hover{text-decoration:underline}
  .alsoin{margin-top:6px;font-size:.7rem;color:var(--muted)}
  .alsoin a{color:var(--cyan);text-decoration:none;cursor:pointer}
  .alsoin a:hover{text-decoration:underline}
  .spiderGrid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px, transparent 1px);background-size:80px 80px;mask-image:radial-gradient(circle at center,black,transparent 78%);pointer-events:none}
  .wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .spoke{stroke-width:1.8;fill:none;opacity:.88}
  .place{position:absolute;transform:translate(-50%,-50%);width:var(--card);cursor:pointer}
  .place.center{width:250px;cursor:default}
  .legend{position:sticky;left:14px;bottom:10px;display:flex;flex-wrap:wrap;gap:5px 12px;width:max-content;max-width:70%;pointer-events:none;padding:4px 0 10px 14px}
  .legend span{display:flex;align-items:center;gap:6px;font-family:ui-monospace,monospace;font-size:.58rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .legend i{width:15px;height:0;border-top:2px solid;display:inline-block}
  .maphint{position:sticky;top:12px;left:14px;width:max-content;max-width:min(560px,calc(100vw - 32px));font-family:ui-monospace,monospace;font-size:.62rem;color:var(--muted);background:rgba(18,21,28,.8);border:1px solid var(--line);border-radius:999px;padding:5px 10px;backdrop-filter:blur(10px);z-index:5}
  @media (max-width:680px){:root{--safe-x:14px}.brand{min-width:100%}.bar{gap:8px}.count{width:100%;margin-left:0}.controls{gap:7px 10px}.seg button{padding:7px 10px;font-size:.68rem}.viewbtn{padding:6px 10px}.srctag{margin-left:0}.shell{gap:10px}.card{border-radius:12px}.name{font-size:.82rem}}
</style>

<script>
const GH_BASE="https://github.com/Ventusltd/data-federation-map-for-globalgrid2050-all-repos";
const LIVE_PAGE="https://ventusltd.github.io/data-federation-map-for-globalgrid2050-all-repos/live_sandbox/federation_control_ledger/";
const EXT_HOME={"DuckDB":"https://duckdb.org","Parquet":"https://parquet.apache.org","GitHub Actions":"https://github.com/features/actions","Elexon BMRS API":"https://bmrs.elexon.co.uk","GitHub Pages":"https://pages.github.com"};
const PAGE_HOME={"globalgrid2050":"https://globalgrid2050.com/","globalgrid2050-hompage":"https://globalgrid2050.com/","data-federation-map-for-globalgrid2050-all-repos":LIVE_PAGE};
const ROOT_NODES=[
  {label:"data-federation-map-for-globalgrid2050-all-repos",type:"data",rag:"green",reason:"active federation repository",child:"data-federation"},
  {label:"data-gb-electricity",type:"data",rag:"red",reason:"contract finding surfaced"},
  {label:"data-interconnectors",type:"data",rag:"red",reason:"contract finding surfaced"},
  {label:"gb-electricity-ui",type:"ui",rag:"red",reason:"depends on verified data repos"},
  {label:"globalgrid2050",type:"source_archive",rag:"blue",reason:"source archive"},

  {label:"Podcast-transcripts",type:"unknown",rag:"amber",reason:"workflow finding"},
  {label:"pv-arc-protection-circuit",type:"unknown",rag:"amber",reason:"workflow finding"},
  {label:"Solar-PV-Hybrid-and-off-grid",type:"unknown",rag:"amber",reason:"workflow finding"},
  {label:"solar-repowering-whitepaper",type:"unknown",rag:"amber",reason:"workflow finding"},
  {label:"youengineer-code-review",type:"ui",rag:"amber",reason:"reference UI pattern source"},
  {label:"DuckDB",type:"external",rag:"blue",reason:"proof query engine"},
  {label:"Parquet",type:"external",rag:"blue",reason:"columnar proof store"},
  {label:"Elexon BMRS API",type:"external",rag:"blue",reason:"external electricity source"},
  {label:"GitHub Actions",type:"external",rag:"blue",reason:"static build runner"},
];
const ROOT_EDGES=[
  [0,12,"external"],[0,13,"external"],[0,5,"governance"],[0,15,"external"],[0,14,"external"],
  [1,4,"archive"],[1,5,"governance"],[1,14,"external"],[1,15,"external"],[1,12,"external"],[1,13,"external"],
  [2,4,"archive"],[2,5,"governance"],[2,14,"external"],[2,13,"external"],[2,1,"repo"],[2,3,"repo"],[2,15,"external"],[2,12,"external"],
  [3,1,"data"],[3,2,"data"],[3,5,"governance"],[3,15,"external"],
  [4,14,"external"],[4,15,"external"],
  [5,14,"external"],[5,0,"data"],[5,1,"data"],[5,2,"data"],[5,3,"repo"],[5,4,"archive"],[5,12,"external"],[5,13,"external"],[5,15,"external"],
  [6,15,"external"],
];
function applyRootLinks(nodes){nodes.forEach(n=>{n.gh=n.type==="external"?null:`https://github.com/Ventusltd/${n.label}`;n.ext=EXT_HOME[n.label]||PAGE_HOME[n.label]||null;});return nodes;}
applyRootLinks(ROOT_NODES);
const CHILD_NODES=[
  {label:"data-federation repo",type:"data",rag:"green",reason:"root of this child scope",gh:GH_BASE+"/tree/main"},
  {label:"live dashboard page",type:"ui",rag:"green",reason:"GitHub Pages browser UI in this repo",gh:GH_BASE+"/tree/main/live_sandbox/federation_control_ledger",ext:LIVE_PAGE},
  {label:"index.html",type:"ui",rag:"green",reason:"page shell for the board",gh:GH_BASE+"/blob/main/live_sandbox/federation_control_ledger/index.html"},
  {label:"app.js",type:"ui",rag:"green",reason:"board renderer and interaction logic",gh:GH_BASE+"/blob/main/live_sandbox/federation_control_ledger/app.js"},

  {label:"data/manifest.json",type:"data",rag:"amber",reason:"root cartridge manifest; key still flagged",gh:GH_BASE+"/blob/main/live_sandbox/federation_control_ledger/data/manifest.json"},
  {label:"data/nodes.json",type:"data",rag:"green",reason:"repo and source nodes for the board",gh:GH_BASE+"/blob/main/live_sandbox/federation_control_ledger/data/nodes.json"},
  {label:"data/edges.json",type:"data",rag:"green",reason:"relationship lines for the board",gh:GH_BASE+"/blob/main/live_sandbox/federation_control_ledger/data/edges.json"},
  {label:"reports folder",type:"unknown",rag:"green",reason:"scan reports and evidence",gh:GH_BASE+"/tree/main/reports"},
  {label:"FEDERATION_MAP_LATEST.md",type:"unknown",rag:"green",reason:"latest human-readable scan report",gh:GH_BASE+"/blob/main/reports/FEDERATION_MAP_LATEST.md"},
  {label:"every-drop-is-the-ocean",type:"unknown",rag:"green",reason:"canonical doctrine and addenda",gh:GH_BASE+"/tree/main/every-drop-is-the-ocean"},
  {label:"GitHub Pages",type:"external",rag:"blue",reason:"static public hosting",ext:LIVE_PAGE},
  {label:"GitHub Actions",type:"external",rag:"blue",reason:"future scanner and validation runner",ext:EXT_HOME["GitHub Actions"],gh:GH_BASE+"/actions"},
];
const CHILD_EDGES=[[0,1,"repo"],[1,2,"repo"],[1,3,"repo"],[1,4,"repo"],[1,5,"data"],[3,5,"data"],[5,6,"data"],[5,7,"data"],[5,8,"data"],[0,9,"governance"],[9,10,"governance"],[0,11,"governance"],[1,12,"external"],[0,13,"external"],[3,13,"external"]];
const SCOPES={"root":{label:"Federation",nodes:ROOT_NODES,edges:ROOT_EDGES},"data-federation":{label:"data-federation internals",nodes:CHILD_NODES,edges:CHILD_EDGES}};
const RAG={green:"#00ff88",amber:"#ffcc00",red:"#ff5555",blue:"#3aa0ff",grey:"#9298a6"};
const ECSS={data:"#00e5ff",governance:"#b47cff",archive:"#7da0c8",external:"#5f76a4",repo:"#b8ccff",workflow:"#00ffff"};
const BADGE={data:"DB",ui:"UI",homepage:"WEB",source_archive:"SRC",unknown:"REPO",external:"EXT",/* 2026-09-14: the node types the registered graphs actually publish, so a card says what it is */repo:"REPO",element:"ELEMENT",canonical:"CANONICAL",copy:"COPY",fragment:"FRAGMENT",reference:"REFERENCE",extract:"EXTRACT",block:"BLOCK",auto:"BLOCK",app:"APP","function":"FUNCTION",cartridge:"CARTRIDGE",composition:"COMPOSITION","library element":"LIBRARY","engine canonical":"ENGINE",engine:"ENGINE",module:"MODULE",category:"GROUP",constant:"CONSTANT",decision:"DECISION",whole:"WHOLE",tool:"TOOL",workflow:"WORKFLOW",run:"RUN",check:"CHECK",artefact:"OUTPUT",chapter:"CHAPTER",foundation:"FOUNDATION",deeplink:"DEEP LINK",decay:"FAULT","class":"CLASS",vedic:"CLASS",electron:"ELECTRON",chemistry:"CHEMISTRY",soul:"SOUL",estate:"ESTATE",bundle:"BUNDLE",layer:"LAYER",dataset:"DATASET",page:"PAGE",site:"SITE",project:"PROJECT",substation:"SUBSTATION"};
const REL={data:"data",governance:"governance",archive:"archive",external:"external",repo:"repo ref",workflow:"workflow"};
const SVGNS="http://www.w3.org/2000/svg";
let mode="both", action="explore", view="column", current=0, scopeKey="root", stack=[];
const sel=document.getElementById("focus"), overlay=document.getElementById("overlay"), elCount=document.getElementById("count"), elCrumbs=document.getElementById("crumbs"), elHint=document.getElementById("hint"), spiderToggle=document.getElementById("spiderToggle"), viewLabel=document.getElementById("viewLabel");
function S(){return SCOPES[scopeKey];}
function rebuildSelect(){sel.innerHTML="";S().nodes.forEach((n,i)=>{const o=document.createElement("option");o.value=i;o.textContent=n.label;sel.appendChild(o);});sel.value=current;}
sel.addEventListener("change",()=>{current=+sel.value;draw();});
document.querySelectorAll("#relSeg button").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.mode;document.querySelectorAll("#relSeg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));draw();}));
document.querySelectorAll("#actSeg button").forEach(b=>b.addEventListener("click",()=>{if(b.disabled)return;action=b.dataset.act;document.querySelectorAll("#actSeg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));draw();}));
spiderToggle.addEventListener("click",()=>{view=view==="spider"?"column":"spider";spiderToggle.setAttribute("aria-pressed",String(view==="spider"));viewLabel.textContent=view==="spider"?"Column":"Spider";draw();});
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(draw,80);}).observe(document.getElementById("stage"));
function actionable(n){return action==="explore" ? true : action==="github" ? !!n.gh : action==="external" ? !!n.ext : false;}
function openUrl(u){if(u)window.open(u,"_blank","noopener");}
function handleTap(i){LINK_NOTE="";return handleTap_(i);}
function handleTap_(i){const n=S().nodes[i];if(action==="explore"){current=i;sel.value=i;draw();}else if(action==="github"){openUrl(n.gh);}else if(action==="external"){openUrl(n.ext);}}

async function loadContents(){try{const get=p=>fetch(CONTENTS_BASE+p,{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(p+" "+r.status);return r.json();});const [mf,nf,ef]=await Promise.all([get("manifest.json"),get("nodes.json"),get("edges.json")]);if(!Array.isArray(nf)||!nf.length)throw new Error("empty nodes");BADGE.eye_app="EYE";BADGE.sense_app="SENSE";BADGE.served_surface="PAGE";REL.contains="contains";ECSS.contains="#7da0c8";const ids={};const nodes=nf.map((n,i)=>{ids[n.id]=i;const inFed=n.path&&n.path.indexOf("data/federation_map")===0;const base=inFed?GH_BASE:MONO_GH;return {label:n.label||n.id,type:n.nodeKind||"unknown",rag:n.rag||"grey",reason:n.path||"repo root",gh:base+(n.path?"/tree/main/"+n.path.replace(/\/+$/,""):""),ext:null};});const edges=(ef||[]).filter(e=>ids[e.from]!==undefined&&ids[e.to]!==undefined).map(e=>[ids[e.from],ids[e.to],e.type||"repo"]);SCOPES[CONTENTS_KEY]={label:"globalgrid2050 contents · declared @ "+(mf.scannedMonolithSHA||"?"),nodes,edges};SCOPES.root.nodes.forEach(n=>{if(n.label==="globalgrid2050")n.child=CONTENTS_KEY;});return true;}catch(e){return false;}}

/* --- ventus-grid-engine receiver additions below. Nothing above this comment
   is changed in behaviour from spider_full_po_test.html, only DATA_BASE (was
   "../../live_sandbox/federation_control_ledger/data/") and CONTENTS_BASE
   (was "../../data/federation_map/contents/provenance=declared/repo=Ventusltd__globalgrid2050/")
   were repointed at the copies under ./spider/, and the stylesheet <link>
   now reads "./spider/federation_radial.css". The reference's own IIFE at
   its end is replaced by wireReceiver() below, which does the same
   loadRoot()+loadContents() call and then adds manifest-driven graphs on
   top, using the existing scope/card/FOCUS machinery unchanged. --- */
const RECEIVER_MANIFEST_PATH="./spider/manifest.json";
/* Snapshot fallback of spider/manifest.json's two receiver-owned slots, kept
   in sync with that file by hand. Exists for the same reason ROOT_NODES
   above exists: fetch() cannot load file:// resources at all in Chromium
   ("URL scheme file is not supported", confirmed while proving this page),
   so a file://-opened copy would otherwise never offer these two graphs even
   though the spider/manifest.json fetch is the source of truth whenever it
   IS reachable (e.g. served over http/https, including GitHub Pages). */
const MANIFEST_FALLBACK={graphs:[
  {id:"engine-graph",title:"Engine population",path:"./genome/engine-graph.json",source_spider:"genome-spider (population phase)",description:"The ventus-grid-engine population graph. Not owned by this page; may not exist yet."},
  {id:"genome-spider",title:"genome-spider output",path:"./spider/data/genome-spider.json",source_spider:"spiders/species/genome-spider",description:"Documented empty slot for spiders/species/genome-spider's own output, which did not exist when this receiver was built."}
]};
function placeholderScope(title,path){return {label:title,nodes:[{label:title+" — not yet emitted",type:"unknown",rag:"grey",reason:"Populated once "+path+" exists and is reachable from this page."}],edges:[]};}
function resolveRef(ids,r){return ids[r]!==undefined?ids[r]:r;}
function normaliseGenericGraph(raw,gid){
  const rawNodes=Array.isArray(raw.nodes)?raw.nodes:(Array.isArray(raw.features)?raw.features.map(f=>({id:f.id,...(f.properties||{})})):[]);
  const ids={};
  const nodes=rawNodes.map((n,i)=>{const id=n.id!==undefined?n.id:i;ids[id]=i;return deriveLinks({label:n.label||n.title||String(id),type:n.type||n.nodeKind||n.repo_type||"unknown",rag:n.rag||n.status||"grey",reason:n.reason||n.status_reason||n.path||"",gh:n.gh||null,ext:n.ext||null},gid);});
  const rawEdges=Array.isArray(raw.edges)?raw.edges:(Array.isArray(raw.links)?raw.links:[]);
  const edges=rawEdges.map(e=>Array.isArray(e)?[resolveRef(ids,e[0]),resolveRef(ids,e[1]),e[2]||"repo"]:[resolveRef(ids,e.from!==undefined?e.from:e.source),resolveRef(ids,e.to!==undefined?e.to:e.target),e.type||"repo"]).filter(e=>typeof e[0]==="number"&&typeof e[1]==="number");
  return {nodes,edges};
}
async function loadManifestScope(entry){
  try{const r=await fetch(entry.path,{cache:"no-cache"});if(!r.ok)throw new Error(entry.path+" "+r.status);const raw=await r.json();const g=normaliseGenericGraph(raw,entry.id);if(!g.nodes.length)throw new Error("empty");return {label:entry.title,nodes:g.nodes,edges:g.edges,live:true};}
  catch(e){return {...placeholderScope(entry.title,entry.path),live:false};}
}
async function wireReceiver(){
  let manifest=MANIFEST_FALLBACK;
  try{const r=await fetch(RECEIVER_MANIFEST_PATH,{cache:"no-cache"});if(r.ok){const live=await r.json();if(Array.isArray(live.graphs)&&live.graphs.length)manifest=live;}}catch(e){}
  /* Every graph the manifest lists, except the two the page builds itself.
     This read `g.id==="engine-graph"||g.id==="genome-spider"` - a hard-coded
     pair - so a manifest could add graphs for ever and the page would never
     request them; gridatlas-lineage sat in the live manifest and was never
     fetched (network trace, 2026-09-04). A receiver that "will constantly
     also receive cartridges like gridatlas" has to read what it is given. */
  const BUILT_IN=new Set(["federation","globalgrid2050-contents"]);
  const extra=(manifest.graphs||[]).filter(g=>g&&g.id&&g.path&&!BUILT_IN.has(g.id));
  for(const entry of extra){
    const scope=await loadManifestScope(entry);
    SCOPES[entry.id]=scope;
    SCOPES.root.nodes.push({label:entry.title,type:"unknown",rag:scope.live?"green":"grey",reason:entry.description||"",child:entry.id,gh:null,ext:null});
  }
  try{const ir=await fetch("./spider/identity.json",{cache:"no-cache"});if(ir.ok)IDENTITY=await ir.json();}catch(e){}
  const qp=new URLSearchParams(location.search);
  const want=qp.get("graph");
  let linkNote="";if(want){const key=want==="federation"?"root":want;if(SCOPES[key]){stack=key==="root"?[]:[{key:"root",current:0}];scopeKey=key;current=0;}else{linkNote=`The link asked for a graph named "${want}", which this page does not list; showing ${SCOPES.root.label}.`;}}
  /* ?focus=<node label> centres the graph on one module.
     ------------------------------------------------------------------------
     Written 202609050300 so the dashboards can link INTO the maths rather
     than at it: a File menu in GridAtlas or Pipeline News names a module and
     lands the reader on that node with its dependencies already drawn. The
     match is on the node's own label, exact first and then case-insensitively,
     so a link is written with the same string the graph publishes -- no second
     naming scheme to drift. An unknown focus is IGNORED, never an error: the
     graph still opens on its default, which is what a reader following a stale
     link should get. */
  const wantFocus=qp.get("focus");
  if(wantFocus){
    const ns=S().nodes;
    let i=ns.findIndex(n=>n.label===wantFocus);
    if(i<0){const lc=wantFocus.toLowerCase();i=ns.findIndex(n=>String(n.label||"").toLowerCase()===lc);}
    if(i>=0)current=i;else linkNote+=(linkNote?" ":"")+`The link named a card "${wantFocus}", which this graph does not contain; showing its first card.`;
  }
  rebuildSelect();draw();
  /* 2026-09-14: a stale or mistyped link is still ignored, never an error, but the hint line now says so once, so a reader following it knows why the page is not where the link promised. */
  if(linkNote){LINK_NOTE=linkNote;setHint();}
}
(async()=>{const src=await loadRoot();await loadContents();const tag=document.getElementById("srcTag");if(tag){tag.textContent=src;tag.classList.toggle("live",src==="live");}await wireReceiver();})();
</script>
